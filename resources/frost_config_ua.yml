time_precision: MSECS
logging_level: ERROR
reactors:
  frost_link:
    logging_level: ERROR
    parameters:
      data_model_path: "resources/data_model/frost_link.yml"
    reactors:
      message_filter:
        logging_level: ERROR
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resources/data_model/opcua_conveyor_full.yml"
      conveyor_graph: "resources/conveyor_graph/conveyor_graph.gml"
      pallet_metric: "DISTANCE"
    reactors:
     message_filter:
       logging_level: ERROR
  scheduler:
    logging_level: DEBUG
    parameters:
      data_model_path: "resources/scheduler_tasks/demo-lego-scheduler.yml"
      scheduling_instance: "resources/schedules/simulation-lego-demo.json"
      task_mapping:
        LD: /Scheduler/LD
        RBTC: /Scheduler/RBTC
        QC: /Scheduler/QC
        DISASSEMBLE: /Scheduler/DISASSEMBLE
        RESERVE: /Scheduler/RESERVE
        PUT_BACK: /Scheduler/PUT_BACK
    reactors:
      message_filter:
        logging_level: ERROR
  cell5:
    logging_level: DEBUG
    parameters:
      data_model_path: "resources/data_model/opcua_cell5.yml"
    reactors:
      message_filter:
        logging_level: ERROR
  cell4:
    logging_level: ERROR
    parameters:
      data_model_path: "resources/data_model/opcua_cell4.yml"
    reactors:
      message_filter:
        logging_level: ERROR
  