name: "scheduler" 
root:
  !!FolderNode
  name: "Scheduler"
  description: ""
  children:
    - !!CompositeMethodNode
      name: "StartTask1"
      returns:
        - !!NumericalVariableNode
          name: "palletNumber"
          initial_value: "${palletNumber}"
      cfg:
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/callFreePalletToWithReservation"
          args: [40, 1]  # destination, reservationId
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_5"
          rhs: "${palletNumber}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${palletNumber}", 0]  # palletNumber, destination
    - !!CompositeMethodNode
      name: "StartTask2"
      parameters:
        - !!NumericalVariableNode
          name: "palletNumber"
          default_value: 0
      cfg:
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${palletNumber}", 34]  # palletNumber, destination
        - !!WaitRemoteEventNode
            remote_id: "conveyor"
            variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_4_2"
            rhs: "${palletNumber}"
            operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${palletNumber}", 0]  # palletNumber, destination
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          args: ["${palletNumber}"]  # palletNumber
