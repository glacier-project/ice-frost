name: "cell2"
machine_category: "unknown"
machine_type: "unknown"
machine_model: "unknown"
description: "Cella 2 (UR5 ed EMCO)"
connectors:
- !!MqttConnector
  name: broker
  ip: mdm-rmq-test
  port: 1883
  username_env_var: MQTT_USER
  password_env_var: MQTT_PASSWORD
  topic_prefix: ice/data/icefrost/cell2
  payload_codec: json
root:
  !!FolderNode
  name: "Objects"
  description: ""
  children:
    - !!FolderNode
      name: "OPCUA"
      description: ""
      children:
        - !!FolderNode
          name: "MES"
          description: "MES"
          children:
            - !!StringVariableNode
              name: "CurrentMission"
              description: "Current mission"
              initial_value: ""
              connector_name: broker
            - !!BooleanVariableNode
              name: "MESBusy"
              description: "Busy"
              initial_value: False
              connector_name: broker
            - !!BooleanVariableNode
              name: "MESLastResult"
              description: ""
              initial_value: False
              connector_name: broker
            - !!FolderNode
              name: "Methods"
              description: "Methods"
              children:
                - !!FolderNode
                  name: "EngraveText"
                  description: ""
                  children:
                    - !!AsyncMethodNode
                      name: "EngraveText"
                      description: "Engrave a text"
                      parameters:
                        - !!StringVariableNode
                          name: "text"
                          description: ""
                          default_value: ""
                      returns:
                        - !!BooleanVariableNode
                          name: "accepted"
                          description: ""
                - !!FolderNode
                  name: "StartMission"
                  description: ""
                  children:
                    - !!AsyncMethodNode
                      name: "StartMission"
                      description: "Start a mission"
                      parameters:
                        - !!StringVariableNode
                          name: "mission_name"
                          description: ""
                          default_value: ""
                      returns:
                        - !!BooleanVariableNode
                          name: "accepted"
                          description: ""
