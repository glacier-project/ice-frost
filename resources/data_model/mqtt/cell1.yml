name: cell1
machine_category: unknown
machine_type: unknown
machine_model: unknown
description: Cella 1 (SPEA Flying Probe Tester)
connectors:
- !!MqttConnector
  name: broker
  ip: mdm-rmq-test
  port: 1883
  username_env_var: MQTT_USER
  password_env_var: MQTT_PASSWORD
  topic_prefix: ice/data/icefrost/cell1
  payload_codec: json
root: 
  !!FolderNode
  name: Objects
  description: ''
  children:
  - !!FolderNode
    name: FlyingProbeTester
    description: ''
    children:
    - !!AsyncMethodNode
      name: ShowMessage
      description: Show a warning or error message to the operator.
      parameters:
      - !!StringVariableNode
        name: text
        description: ''
      returns:
      - !!BooleanVariableNode
        name: accepted
        description: ''
    - !!AsyncMethodNode
      name: BoardIn
      description: Bring the next board in the testing zone.
      parameters: []
      returns:
      - !!BooleanVariableNode
        name: accepted
        description: ''
    - !!AsyncMethodNode
      name: BoardOut
      description: Take out the board from the testing zone.
      parameters: []
      returns:
      - !!BooleanVariableNode
        name: accepted
        description: ''
    - !!BooleanVariableNode
      name: Busy
      description: Is the machine busy with an operation?
      initial_value: false
      connector_name: broker
    - !!StringVariableNode
      name: CurrentMission
      description: Operation in progress.
      initial_value: ''
      connector_name: broker
    - !!AsyncMethodNode
      name: DownloadFirmware
      description: Download a customized firmware from the dedicated server.
      parameters:
      - !!StringVariableNode
        name: sourceFilename
        description: ''
      - !!StringVariableNode
        name: customID
        description: ''
      returns:
      - !!StringVariableNode
        name: destFilename
        description: ''
    - !!StringVariableNode
      name: LastResult
      description: Result of the last operation.
      initial_value: ''
      connector_name: broker
    - !!AsyncMethodNode
      name: StartTest
      description: Start testing the current board.
      parameters:
      - !!StringVariableNode
        name: serialNumber
        description: ''
      returns:
      - !!BooleanVariableNode
        name: accepted
        description: ''
