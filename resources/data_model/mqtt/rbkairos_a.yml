name: "rbkairos_a" # name of the machine
machine_category: "Mobile Robot" # category of the machine
machine_type: "unknown" # type of the machine
machine_model: "unknown" # model of the machine
description: "Salacchia" # description of the machine
connectors:
- !!MqttConnector
  name: broker
  ip: mdm-rmq-test
  port: 1883
  username_env_var: MQTT_USER
  password_env_var: MQTT_PASSWORD
  topic_prefix: ice/data/icefrost/rbkairos/a
  payload_codec: json
root:
  !!FolderNode
  name: "RBKairos"
  description: "OPCUA"
  children:
    - !!FolderNode
      name: "Mission_Methods"
      description: "OPCUA"
      children:
        - !!AsyncMethodNode
          name: "start_mission"
          description: "Move"
          parameters:
            - !!StringVariableNode
              name: "name"
              description: "Destination"
              default_value: "default"
          returns:
            - !!BooleanVariableNode
              name: "Result"
              description: ""
        - !!AsyncMethodNode
          name: "preemptRunningMission"
          description: "Move"
          returns:
            - !!BooleanVariableNode
              name: "accepted"
              description: ""
        - !!BooleanVariableNode
          name: "Control_Busy"
          description: ""
          initial_value: False
          connector_name: broker
        - !!BooleanVariableNode
          name: "Last_Mission_Result"
          description: ""
          initial_value: False
          connector_name: broker
        - !!NumericalVariableNode
          name: "Missions_Call_Counter"
          description: "Number of calls"
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
          connector_name: broker
        - !!StringVariableNode
          name: "Ongoing_Mission_Feedback"
          description: "control"
          initial_value: ""
          connector_name: broker
        - !!StringVariableNode
          name: "Ongoing_Mission_Name"
          description: "control"
          initial_value: ""
          connector_name: broker
    
