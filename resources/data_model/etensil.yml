name: "etensil" # name of the machine
machine_category: "unknown" # category of the machine
machine_type: "unknown" # type of the machine
machine_model: "unknown" # model of the machine
description: "eTensil electric screwdriver" # description of the machine

root:
  !!FolderNode
  name: "Objects"
  description: "OPCUA"
  children:
    - !!FolderNode
      name: "eTensil"
      description: "eTensil"
      children:
        - !!FolderNode
          name: "MES"
          description: "MES"
          children:
            - !!BooleanVariableNode
              name: "busy"
              description: "ice_data_etensil_control"
              initial_value: False
            - !!BooleanVariableNode
              name: "last_operation_result"
              description: "ice_data_etensil_control"
              initial_value: True
            - !!AsyncMethodNode
              name: "doSingleScrew"
              description: "Single screw with the current program"
              returns:
                - !!BooleanVariableNode
                  name: "accepted"
                  description: ""
        - !!FolderNode
          name: "DeviceStatus"
          description: "0 OFF, 1 ON, 2 NOT_MAPPED"
          children:
            - !!NumericalVariableNode
              name: "01_ready"
              description: "ice_data_etensil_state"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 1
            - !!NumericalVariableNode
              name: "02_motor_is_rotating"
              description: "ice_data_etensil_state"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "04_screw_ok"
              description: "ice_data_etensil_state"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "05_end_program"
              description: "ice_data_etensil_state"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
        - !!FolderNode
          name: "ScrewResult"
          description: "ice_data_etensil_state"
          children:
            - !!NumericalVariableNode
              name: "current_program_errors"
              description: "tight_result"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "current_screw_number"
              description: "tight_result"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "last_screw_angle"
              description: "tight_result"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "last_screw_result"
              description: "0 UNKNOWN, 1 OK, 2 NOK, 3 REV"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!NumericalVariableNode
              name: "last_screw_time"
              description: "tight_result"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            - !!StringVariableNode
              name: "last_screw_timestamp"
              description: "tight_result"
              initial_value: ""
            - !!NumericalVariableNode
              name: "last_screw_torque"
              description: "tight_result"
              measure_unit: "NoneMeasureUnits.NONE"
              initial_value: 0
            