name: "cell5" # name of the machine
machine_category: "unknown" # category of the machine
machine_type: "unknown" # type of the machine
machine_model: "unknown" # model of the machine
description: "Checks Lego on the Conveyor Belt" # description of the machine
root:
  !!FolderNode
  name: "Cell5"
  description: "OPCUA"
  children:
    - !!ObjectVariableNode
      name: "results"
      description: "Results of the checks"
      properties:
        - !!BooleanVariableNode
          name: "busy"
          description: "Indicates if the machine is busy"
          initial_value: False
        - !!BooleanVariableNode
          name: "result_ready"
          description: "Quality of the Cover"
          initial_value: False
        - !!BooleanVariableNode
          name: "result"
          description: "Quality of the Lego"
          initial_value: False
    - !!FolderNode
      name: "Utils"
      description: "Variables"
      children:
        - !!AsyncMethodNode
          name: "check_color"
          description: "Checks color"
          parameters:
            - !!StringVariableNode
              name: "color"
              description: "Color to check"
              default_value: ""
          returns:
            - !!BooleanVariableNode
              name: "is_correct"
              description: "Indicates if the color is correct"
        - !!AsyncMethodNode
          name: "check_shape"
          description: "Checks shape"
          parameters:
            - !!NumericalVariableNode
              name: "shape1"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
            - !!NumericalVariableNode
              name: "shape2"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
            - !!NumericalVariableNode
              name: "shape3"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0     
            - !!NumericalVariableNode
              name: "pallet_content1"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0       
            - !!NumericalVariableNode
              name: "pallet_content2"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0       
            - !!NumericalVariableNode
              name: "pallet_content3"
              description: ""
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
          returns:
            - !!BooleanVariableNode
              name: "is_correct"
              description: "Indicates if the shape is correct"
    - !!FolderNode
      name: "Methods"
      description: ""
      children:        
        - !!CompositeMethodNode
          name: "CheckQualityCovers"
          description: "Checks quality"
          parameters:
            - !!StringVariableNode
              name: "color"
              description: "Cover color"
              default_value: ""
          returns:
            - !!BooleanVariableNode
              name: "result"
              description: "QualityCover"
          cfg: 
            - !!CallMethodNode
              method: "Cell5/Utils/check_color"
              args:
                - "${color}"
            - !!WaitConditionNode
              variable: "Cell5/results/result_ready"
              operator: "=="
              rhs: True
            - !!ReadVariableNode
              variable: "Cell5/results/result"
              store_as: "result"
        - !!CompositeMethodNode
          name: "CheckQualityLego"
          description: "Checks quality"
          parameters:
            - !!NumericalVariableNode
              name: "shape1"
              description: "Quality of the Lego"
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
            - !!NumericalVariableNode
              name: "shape2"
              description: "Lego image"
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
            - !!NumericalVariableNode
              name: "shape3"
              description: "Lego image"
              measure_unit: "NoneMeasureUnits.NONE"
              default_value: 0
          returns:
            - !!BooleanVariableNode
              name: "result"
              description: "Quality of the Lego"
          cfg:
            - !!ReadRemoteVariableNode
              variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_4_2"
              remote_id: "conveyor"
              store_as: "pallet_id"
            - !!ReadRemoteVariableNode
              variable: "/Objects/ConveyorHMI/ConveyorObjects/Pallets/Pallet${pallet_id}/contentPosition1"
              remote_id: "conveyor"
              store_as: "pallet_content1"
            - !!ReadRemoteVariableNode
              variable: "/Objects/ConveyorHMI/ConveyorObjects/Pallets/Pallet${pallet_id}/contentPosition2"
              remote_id: "conveyor"
              store_as: "pallet_content2"
            - !!ReadRemoteVariableNode
              variable: "/Objects/ConveyorHMI/ConveyorObjects/Pallets/Pallet${pallet_id}/contentPosition3"
              remote_id: "conveyor"
              store_as: "pallet_content3"
            - !!CallMethodNode
              method: "Cell5/Utils/check_shape"
              args:
                - "${shape1}"
                - "${shape2}"
                - "${shape3}"
                - "${pallet_content1}"
                - "${pallet_content2}"
                - "${pallet_content3}"
            - !!WaitConditionNode
              variable: "Cell5/results/result_ready"
              operator: "=="
              rhs: True
            - !!ReadVariableNode
              variable: "Cell5/results/result"
              store_as: "result"
    - !!FolderNode
      name: "Status"
      description: "Variables"
      children:
        - !!BooleanVariableNode
          name: "Busy"
          description: "Lego image"
          initial_value: False
        - !!StringVariableNode
          name: "CurrentMission"
          description: "Lego image"
          initial_value: ""
        - !!BooleanVariableNode
          name: "LastResult"
          description: "Lego image"
          initial_value: False   
    - !!FolderNode
      name: "Statistics"
      description: "Contains statistics of the Lego analyzed"
      children:
        - !!NumericalVariableNode
          name: "ChecksGadget"
          description: ""
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
        - !!NumericalVariableNode
          name: "ChecksLego"
          description: ""
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
        - !!NumericalVariableNode
          name: "ChecksTotal"
          description: ""
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
        - !!NumericalVariableNode
          name: "FaultsGadget"
          description: ""
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
        - !!NumericalVariableNode
          name: "FaultsLego"
          description: ""
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0
        - !!NumericalVariableNode
          name: "FaultsTotal"
          description: "Number of faults"
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0

    